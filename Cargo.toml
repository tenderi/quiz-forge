[package]
name = "quiz-forge"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Self-hosted quiz question bank: Telegram submissions, group voting, AI review, seeded quiz-night builder"
license = "MIT"
repository = "https://github.com/tenderi/quiz-forge"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["multipart", "macros"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace"] }
maud = { version = "0.27", features = ["axum"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
teloxide = { version = "0.17", default-features = false, features = ["macros", "ctrlc_handler", "rustls"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.11"
hex = "0.4"
rand = "0.10"
unicode-normalization = "0.1"
regex = "1"
similar = "3"
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
futures = "0.3"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"

[profile.release]
strip = true
lto = "thin"
